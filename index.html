<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seal VTuber MVP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-soft mirror">
  <main id="stage">
    <!--
      角色 = 三張同構圖的去背 PNG（1024 x 1024）+ 疊在臉上的向量圖層：
        art/seal-flippers.png 前鰭（在身體前面，只留腳掌與鰭根，以肩膀為支點小幅擺動）
        art/seal-body.png 身體（不含前鰭，固定不動；頂端多畫了一截圓頂藏在頭後面，用 body-mask 把太高的部分遮掉）
        art/seal-head.png 頭（轉頭、點頭、側傾都只動這一層，臉上的疊圖層跟著一起動）
      程式只靠下面這些 id 找圖層，換圖時保留 id、依新圖量座標並同步修改 js/rig.js 開頭的常數：
        avatar / flipper-left / flipper-right / body / head
        eye-left-open / eye-left-closed / eye-left-happy
        eye-right-open / eye-right-closed / eye-right-happy
        mouth-open / blush / zzz / exclaim
      眼睛的做法：eye-patches 先用毛色蓋住底圖畫好的眼睛，再用向量畫一對一樣的眼睛，才能眨眼、看方向、換笑眼。
      目前座標：眼睛中心 (401, 350) 與 (636, 350)，嘴巴上緣 (515, 452)，腮紅 (356, 418) 與 (678, 416)。
    -->
    <svg id="seal" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="海豹 VTuber 角色">
      <defs>
        <filter id="patch-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" /></filter>
        <filter id="soft-1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.8" /></filter>
        <!-- 身體圖的圓頂藏在頭後面：y=505 以下全部顯示；以上只留一個「脖子」形狀（肩膀往上到 y≈482 後，
             沿扁橢圓往內收到頭後面）。頭轉動時露出來的是脖子的弧線與白毛，不會出現第二層頭的輪廓 -->
        <!-- 前鰭圖只留腳掌與鰭根：y=850 以下全顯示，往上到 y=780 漸漸淡出（鰭圖上半段的「手臂」疊在身體上會穿幫）。
             左右各一個遮罩，順便裁掉鰭圖中間 x≈508–520 的分隔線 -->
        <linearGradient id="flipper-fade" gradientUnits="userSpaceOnUse" x1="0" y1="780" x2="0" y2="850">
          <stop offset="0" stop-color="#fff" stop-opacity="0" />
          <stop offset="1" stop-color="#fff" stop-opacity="1" />
        </linearGradient>
        <!-- 頭圖的下巴邊緣往下淡出（y=592 全顯示 → y=668 透明），讓頭融進胸口，不會像貼上去的一塊 -->
        <linearGradient id="head-fade" gradientUnits="userSpaceOnUse" x1="0" y1="592" x2="0" y2="668">
          <stop offset="0" stop-color="#fff" stop-opacity="1" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <mask id="head-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect x="0" y="0" width="1024" height="1024" fill="url(#head-fade)" /></mask>
        <mask id="flipper-mask-left" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect x="0" y="0" width="500" height="1024" fill="url(#flipper-fade)" /></mask>
        <mask id="flipper-mask-right" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect x="524" y="0" width="500" height="1024" fill="url(#flipper-fade)" /></mask>
        <mask id="body-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
          <path fill="#fff" d="M 0 505 H 260 L 270 482 A 263 95 0 0 1 802 482 L 814 505 H 1024 V 1024 H 0 Z" />
        </mask>
      </defs>

      <g id="avatar">
        <g id="body" mask="url(#body-mask)">
          <image href="art/seal-body.png" x="0" y="0" width="1024" height="1024" />
          <!-- 脖子的描邊：接在肩膀描邊的末端往內收，讓轉頭時露出的輪廓是連續的 -->
          <path id="neck-line" d="M 279 490 A 258 90 0 1 1 793 490" fill="none" stroke="#1E2016" stroke-width="5" stroke-linecap="round" opacity="0.8" />
        </g>

        <!-- 前鰭：放在身體前面（像原圖一樣手放在肚子前），兩隻鰭畫在同一張圖的左右兩半，各自用遮罩只留腳掌與鰭根 -->
        <g id="flippers">
          <g id="flipper-left"><image href="art/seal-flippers.png" x="0" y="0" width="1024" height="1024" mask="url(#flipper-mask-left)" /></g>
          <g id="flipper-right"><image href="art/seal-flippers.png" x="0" y="0" width="1024" height="1024" mask="url(#flipper-mask-right)" /></g>
        </g>

        <g id="head">
          <image id="base" href="art/seal-head.png" x="0" y="0" width="1024" height="1024" mask="url(#head-mask)" />

          <g id="features">
            <!-- 蓋住底圖的眼睛 -->
            <g id="eye-patches" fill="#EDEAE8" filter="url(#patch-soft)">
              <ellipse cx="401" cy="350" rx="54" ry="62" />
              <ellipse cx="636" cy="350" rx="54" ry="62" />
            </g>

            <g id="blush" opacity="0">
              <ellipse cx="356" cy="418" rx="50" ry="32" fill="#F2A0AC" />
              <ellipse cx="678" cy="416" rx="54" ry="34" fill="#F2A0AC" />
            </g>

            <g id="eye-left">
              <g id="eye-left-open">
                <ellipse cx="401" cy="350" rx="37" ry="44" fill="#1A1719" />
                <ellipse cx="390" cy="332" rx="8" ry="13" transform="rotate(-15 390 332)" fill="#FFFFFF" />
                <circle cx="413" cy="373" r="4" fill="#FFFFFF" opacity="0.85" />
              </g>
              <path id="eye-left-closed" d="M 365 356 Q 401 374 437 356" stroke="#2B2628" stroke-width="6" stroke-linecap="round" fill="none" opacity="0" />
              <path id="eye-left-happy" d="M 364 364 Q 401 322 438 364" stroke="#1A1719" stroke-width="11" stroke-linecap="round" fill="none" opacity="0" />
            </g>
            <g id="eye-right">
              <g id="eye-right-open">
                <ellipse cx="636" cy="350" rx="37" ry="44" fill="#1A1719" />
                <ellipse cx="625" cy="332" rx="8" ry="13" transform="rotate(-15 625 332)" fill="#FFFFFF" />
                <circle cx="648" cy="373" r="4" fill="#FFFFFF" opacity="0.85" />
              </g>
              <path id="eye-right-closed" d="M 600 356 Q 636 374 672 356" stroke="#2B2628" stroke-width="6" stroke-linecap="round" fill="none" opacity="0" />
              <path id="eye-right-happy" d="M 599 364 Q 636 322 673 364" stroke="#1A1719" stroke-width="11" stroke-linecap="round" fill="none" opacity="0" />
            </g>

            <g id="mouth">
              <!-- 圓形的張嘴：上緣固定在吻部的微笑線 (515, 456)，張嘴量越大往下拉得越長 -->
              <g id="mouth-open" opacity="0" filter="url(#soft-1)">
                <ellipse cx="515" cy="478" rx="25" ry="22" fill="#5A2F3A" stroke="#3A3032" stroke-width="3" />
                <ellipse cx="515" cy="490" rx="14" ry="8" fill="#F0A0B0" />
              </g>
            </g>
          </g>
        </g>

        <!-- 反應符號 -->
        <g id="fx" font-family="system-ui, 'Noto Sans TC', sans-serif" font-weight="700">
          <text id="zzz" x="740" y="250" font-size="68" fill="#5A6B7A" opacity="0">z z z</text>
          <text id="exclaim" x="770" y="290" font-size="120" fill="#F0735A" opacity="0">!</text>
        </g>
      </g>
    </svg>
  </main>

  <aside id="panel" class="panel">
    <header class="panel__head">
      <strong>海豹 VTuber MVP</strong>
      <span id="status" class="status">準備中…</span>
    </header>
    <section class="panel__row">
      <button id="btn-camera" type="button">啟動攝影機</button>
      <button id="btn-calibrate" type="button" disabled title="把目前的頭部姿勢當成正面">校正正面 (C)</button>
      <button id="btn-demo" type="button">示範模式 (D)</button>
    </section>
    <section class="panel__row">
      <label><input id="chk-mirror" type="checkbox" checked /> 鏡像 (M)</label>
      <label><input id="chk-preview" type="checkbox" /> 顯示攝影機畫面 (V)</label>
    </section>
    <section class="panel__row">
      <span class="label">背景</span>
      <button type="button" data-bg="soft" class="is-active">柔和</button>
      <button type="button" data-bg="green">綠幕</button>
      <button type="button" data-bg="blue">藍幕</button>
      <button type="button" data-bg="transparent">透明</button>
    </section>
    <section id="debug" class="debug">
      <div>狀態 <b id="dbg-state">—</b> <span id="dbg-fps-wrap">fps <b id="dbg-fps">0</b></span></div>
      <div>yaw <b id="dbg-yaw">0</b> pitch <b id="dbg-pitch">0</b> roll <b id="dbg-roll">0</b></div>
      <div>blink <b id="dbg-blink">0</b> jaw <b id="dbg-jaw">0</b> smile <b id="dbg-smile">0</b></div>
    </section>
    <footer class="panel__foot">
      按 H 隱藏/顯示面板。網址參數：<code>?ui=0</code> 隱藏面板、<code>?bg=green</code> 綠幕、<code>?autostart=1</code> 自動開攝影機、<code>?demo=1</code> 示範、<code>?mode=tracker</code> 追蹤頁、<code>?mode=viewer</code> 顯示頁（給 OBS）。
    </footer>
  </aside>

  <video id="cam" class="cam" playsinline muted autoplay></video>

  <script src="js/rig.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
